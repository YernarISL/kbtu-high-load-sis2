syntax = "proto3";
package leaderboard.v1;
option java_multiple_files = true;
option java_package = "com.example.leaderboard.grpc.v1";

service LeaderboardService {
  rpc SubmitScore(SubmitScoreRequest) returns (SubmitScoreResponse);
  rpc GetTop(GetTopRequest) returns (GetTopResponse);
  rpc GetNeighbors(GetNeighborsRequest) returns (GetNeighborsResponse);
  rpc GetUserRank(GetUserRankRequest) returns (Entry);
  rpc WatchTop(WatchTopRequest) returns (stream GetTopResponse);
}

message Entry {
  string user_id = 1;
  string username = 2;
  string region = 3;
  int32 rank = 4;
  int64 score = 5;
}
message SubmitScoreRequest {
  string leaderboard_id = 1;
  string user_id = 2;
  int64 score = 3;
  string match_hash = 4;
  string idempotency_key = 5;   // same key on every retry of one logical write
}
message SubmitScoreResponse {
  int64 best_score = 1;
  int64 rank = 2;
  bool replayed = 3;            // true when the server recognised a retry
}
message GetTopRequest { string leaderboard_id = 1; int32 limit = 2; int32 offset = 3; }
message GetTopResponse { repeated Entry entries = 1; }
message GetNeighborsRequest { string leaderboard_id = 1; string user_id = 2; int32 radius = 3; }
message GetNeighborsResponse { repeated Entry entries = 1; }
message GetUserRankRequest { string leaderboard_id = 1; string user_id = 2; }
message WatchTopRequest { string leaderboard_id = 1; int32 limit = 2; }