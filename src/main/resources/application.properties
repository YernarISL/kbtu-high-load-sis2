spring.application.name=leaderboard

# PostgreSQL: timeouts at every hop, so a slow dependency fails fast instead of piling up threads
spring.datasource.url=jdbc:postgresql://localhost:5432/leaderboard
spring.datasource.username=leaderboard
spring.datasource.password=leaderboard
spring.datasource.hikari.maximum-pool-size=20
# ms to wait for a pooled connection
spring.datasource.hikari.connection-timeout=500
spring.datasource.hikari.connection-init-sql=SET statement_timeout = 800
# A schema created by hand from V1__init.sql is adopted as version 1 (no effect on an empty DB)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Redis: per-command timeout
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=500ms

# gRPC (HTTP/2) and REST/JSON baseline (HTTP/1.1)
spring.grpc.server.port=9090
server.port=8080

management.endpoints.web.exposure.include=health,info,metrics
